plugins {
    id 'com.android.application'
}

// App version is derived from the current git tag (e.g. tag "v0.0.1" -> versionName "0.0.1",
// versionCode 1). Falls back to a dev value when no tag/git is available.
// Uses providers.exec (not String.execute) so it stays compatible with the Gradle
// configuration cache.
def gitDescribe = ""
try {
    gitDescribe = providers.exec {
        commandLine 'git', 'describe', '--tags', '--always', '--dirty'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
} catch (ignored) {
}

def tagVersionName = gitDescribe ? (gitDescribe.startsWith('v') ? gitDescribe.substring(1) : gitDescribe) : '0.0.0'

def tagVersionCode = 1
def versionMatcher = (gitDescribe.replaceFirst(/^v/, '') =~ /(\d+)\.(\d+)\.(\d+)/)
if (versionMatcher.find()) {
    tagVersionCode = versionMatcher.group(1).toInteger() * 1000000 + versionMatcher.group(2).toInteger() * 1000 + versionMatcher.group(3).toInteger()
}

// local.properties is not exposed as Gradle project properties (AGP only reads sdk.dir from it),
// so load it explicitly to allow keeping the Sentry DSN out of version control.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
// The command line wins over local.properties, so a one-off build can be pointed at another project
// without editing the file.
def sentryDsn = project.findProperty('SENTRY_DSN') ?: localProps.getProperty('SENTRY_DSN') ?: System.getenv('SENTRY_DSN') ?: ''

android {
    namespace 'com.brouken.player'
    compileSdk = 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        def abiFilter = project.findProperty("abiFilter")
        applicationId "com.justplus.player"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode tagVersionCode
        versionName tagVersionName
        // Sentry DSN is a public client key (shipped in every APK). Supply it via a SENTRY_DSN entry
        // in local.properties/gradle.properties, -PSENTRY_DSN=, or the SENTRY_DSN env var (see above).
        // When empty, Sentry initialization is skipped (no-op) and the build still works.
        buildConfigField "String", "SENTRY_DSN", "\"${sentryDsn}\""
        // Crash reporting is off and its setting is hidden. The reporting code stays in place —
        // flipping this back to true restores both Sentry and the privacy category in settings.
        buildConfigField "boolean", "ENABLE_CRASH_REPORTING", "false"
        if (abiFilter) {
            def abiCodeMap = ["x86": 1, "x86_64": 2, "armeabi-v7a": 3, "arm64-v8a": 4]
            versionCode = versionCode * 10 + abiCodeMap[abiFilter]
            ndk {
                abiFilters abiFilter
            }
        }
    }
    base {
        archivesName = "JustPlus.Player.v${defaultConfig.versionName}"
    }
    buildTypes {
        release {
            minifyEnabled false
            //proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The two Intel ABIs are 23 of the 54 MB this APK used to weigh, and nothing that plays video
            // runs on them: every phone, tablet and TV box is ARM, and the x86 Chromebooks that exist
            // translate ARM anyway. Release only, so a debug build still installs on the x86_64 emulator
            // that local checks run on. A whitelist, so what stays is stated rather than inferred.
            // Not the same thing as -PabiFilter above: this is still one universal APK with the plain
            // versionCode, which is what keeps updates working for everyone already on one.
            if (!project.hasProperty('abiFilter')) {
                ndk {
                    abiFilters 'arm64-v8a', 'armeabi-v7a'
                }
            }
        }
    }
    flavorDimensions "targetSdk", "distribution"
    productFlavors {
        latest {
            dimension "targetSdk"
        }
        legacy {
            dimension "targetSdk"
            versionCode = defaultConfig.versionCode + 1_000_000
            versionNameSuffix "-legacy"
            targetSdkVersion 29
        }

        universal {
            dimension "distribution"
            // In-app self-update: only the sideloaded universal build may update itself.
            buildConfigField "boolean", "ENABLE_UPDATE", "true"
        }
        amazon {
            dimension "distribution"
            // Store distribution handles updates; self-update would violate store policy.
            buildConfigField "boolean", "ENABLE_UPDATE", "false"
        }
        accrescent {
            dimension "distribution"
            buildConfigField "boolean", "ENABLE_UPDATE", "false"
        }
    }
    variantFilter { variant ->
        def names = variant.flavors*.name
        if (names.contains("legacy") && (names.contains("amazon") || names.contains("accrescent"))) {
            setIgnore(true)
        }
    }
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release" && variant.flavorName == "latestUniversal") {
            variant.outputs.all { output ->
                output.outputFileName = "${base.archivesName.get()}.apk"
            }
        }
        if (variant.buildType.name == "release" && variant.flavorName == "legacyUniversal") {
            variant.outputs.all { output ->
                output.outputFileName = "${base.archivesName.get()}-legacy.apk"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig = true
    }
    lint {
        disable 'MissingTranslation'
        // The mirror of the line above, and Weblate's to reconcile either way: a string deleted here
        // stays in the translations until they are synced, and lintVital — which runs inside
        // assembleRelease — treats every one of those leftovers as a fatal error. It failed the
        // release build on translations of strings this app stopped having months ago.
        disable 'ExtraTranslation'
        disable 'UnsafeOptInUsageError'
    }
}

dependencies {
    def media3_version = '1.11.0-beta01'
    def androidxCoreVersion = '1.8.0'
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    // Media reads go through OkHttp rather than HttpURLConnection, for the connection pool (see
    // MEDIA_HTTP_CLIENT). Excludes media3-exoplayer like every other media3 module here, so it resolves
    // against the local prebuilt AAR.
    implementation("androidx.media3:media3-datasource-okhttp:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation "androidx.media3:media3-decoder:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-container:$media3_version"
    implementation "androidx.media3:media3-extractor:$media3_version"
    implementation("androidx.media3:media3-exoplayer-dash:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation("androidx.media3:media3-exoplayer-hls:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation("androidx.media3:media3-exoplayer-smoothstreaming:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    implementation("androidx.media3:media3-exoplayer-rtsp:$media3_version") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
    }
    // Rewrites a Dolby Vision profile 7 RPU into its profile 8.1 form (libdovi behind a JNI shim), so
    // profile 7 reaches the display as Dolby Vision instead of as its HDR10 base layer — see
    // Dv7Converter, which supplies the Matroska enhancement-layer hook this library does not have.
    // media3-exoplayer is excluded for the same reason as above: it comes from the local prebuilt AAR.
    // core-ktx would drag androidx.core forward for nothing — the library references none of it.
    // 0.3.0 rather than 0.4.0: same API, same native library, but 0.4.0 is built against API 37 and would
    // force compileSdk forward for one dependency.
    implementation("com.suyashbelekar:exoplayerhdrutils:0.3.0") {
        exclude group: "androidx.media3", module: "media3-exoplayer"
        exclude group: "androidx.core", module: "core-ktx"
    }
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.sigpwned:chardet4j:78.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Drawing one QR code, for the invite on a device with nothing to share it with. Pure Java, no
    // transitive dependencies, and the alternative — handing the invite to a web service that draws it —
    // would send the room's own password to a stranger.
    implementation 'com.google.zxing:core:3.5.3'
    def sentry_version = '8.16.0'
    implementation "io.sentry:sentry-android:$sentry_version"
    implementation project(path: ':doubletapplayerview')
    implementation project(path: ':android-file-chooser')
    implementation fileTree(dir: "libs", include: ["lib-*.aar"])
}